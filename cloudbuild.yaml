# Google Cloud Build configuration for PaperDebugger
# This file automates building and deploying PaperDebugger to Cloud Run
# 
# To use this file:
# 1. Set up substitutions for your secrets in Cloud Build triggers or use Secret Manager
# 2. Run: gcloud builds submit --config=cloudbuild.yaml
# 
# For more information, see: docs/CLOUD_RUN_DEPLOYMENT.md

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/paperdebugger:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/paperdebugger:latest'
      - '.'
    id: 'build-image'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/paperdebugger'
    id: 'push-image'
    waitFor: ['build-image']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gcloud'
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/paperdebugger:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--update-secrets=OPENAI_API_KEY=${_OPENAI_SECRET_NAME}:latest'
      - '--update-secrets=PD_MONGO_URI=${_MONGO_SECRET_NAME}:latest'
      - '--update-secrets=JWT_SIGNING_KEY=${_JWT_SECRET_NAME}:latest'
      - '--memory'
      - '${_MEMORY}'
      - '--cpu'
      - '${_CPU}'
      - '--timeout'
      - '${_TIMEOUT}'
      - '--max-instances'
      - '${_MAX_INSTANCES}'
      - '--min-instances'
      - '${_MIN_INSTANCES}'
    id: 'deploy-cloud-run'
    waitFor: ['push-image']

# Configuration for image storage
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/paperdebugger:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REGISTRY_REPO}/paperdebugger:latest'

# Substitution variables (can be overridden via --substitutions flag)
substitutions:
  _REGION: 'us-central1'
  _ARTIFACT_REGISTRY_REPO: 'paperdebugger-repo'
  _SERVICE_NAME: 'paperdebugger'
  _MEMORY: '1Gi'
  _CPU: '1'
  _TIMEOUT: '300'
  _MAX_INSTANCES: '10'
  _MIN_INSTANCES: '0'
  # Secret names in Secret Manager (customize as needed)
  _OPENAI_SECRET_NAME: 'openai-api-key'
  _MONGO_SECRET_NAME: 'mongo-uri'
  _JWT_SECRET_NAME: 'jwt-signing-key'

# Options
options:
  machineType: 'E2_HIGHCPU_8'
  substitutionOption: 'ALLOW_LOOSE'
  logging: 'CLOUD_LOGGING_ONLY'

# Timeout for the entire build
timeout: '1200s'
